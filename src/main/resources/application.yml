spring:
  application:
    name: steuererklaerung-2025-assistant
  profiles:
    default: local
  datasource:
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  thymeleaf:
    cache: false

steuererklaerung:
  ui-name: Steuererklärung 2025 Assistant
  tax-year: 2025

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/steuererklaerung2025;DB_CLOSE_ON_EXIT=FALSE
